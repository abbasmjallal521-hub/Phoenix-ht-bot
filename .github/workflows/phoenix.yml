name: Phoenix HT Bot

# Each run stays awake for about 5h40m: it answers buttons within seconds and follows every bar.
# The schedule only starts the next run when the current one ends (one run at a time).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only (print messages, send nothing)"
        type: boolean
        default: false

concurrency:
  group: phoenix-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: phoenix_state.json
          key: phoenix-state-${{ github.run_id }}
          restore-keys: phoenix-state-
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_PROVIDER: yahoo
          SYMBOLS: "XAUUSD,XAGUSD,US30,NAS100,USOIL"
          TIMEFRAMES: "1m,5m,15m,30m,1h"
        run: python phoenix_ht_bot.py ${{ inputs.dry_run == true && '--once --dry-run' || '--minutes 340' }}
