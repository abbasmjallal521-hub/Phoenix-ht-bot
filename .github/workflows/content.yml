name: Phoenix Content

# صانع المحتوى: every morning, yesterday's trades as ready-to-post pictures (Instagram, TikTok) with captions in Arabic
# and English, to you on Telegram (the watchdog's bot). Nothing is posted anywhere: you share what you want.
# It reads the bot's saved state from the Actions cache (read only). Any day by hand: Actions › Phoenix Content ›
# Run workflow (day = YYYY-MM-DD, empty = yesterday). A merged change to it also sends yesterday's pictures.
on:
  schedule:
    - cron: "44 5 * * 2-6"           # Tue–Sat 05:44 UTC = 07:44 Beirut in winter (Monday's to Friday's trades)
  workflow_dispatch:
    inputs:
      day:
        description: "The day to make (YYYY-MM-DD). Empty = yesterday"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["watchdog/phoenix_content.py", ".github/workflows/content.yml"]

concurrency:
  group: phoenix-content
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests tzdata
      - name: The bot's saved state (read only)
        uses: actions/cache/restore@v4
        with:
          path: phoenix_state.json
          key: phoenix-state-content-read
          restore-keys: phoenix-state-
      - name: Make the pictures and send them
        env:
          WATCHDOG_BOT_TOKEN: ${{ secrets.WATCHDOG_BOT_TOKEN }}  # sends from the watchdog's own bot
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # else from the signal bot
          WATCHDOG_CHAT_ID: ${{ secrets.WATCHDOG_CHAT_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CONTENT_DAY: ${{ inputs.day }}
          CONTENT_HANDLE: "@phoenix.haz.syndi"                 # the account written on every picture
        run: python watchdog/phoenix_content.py
